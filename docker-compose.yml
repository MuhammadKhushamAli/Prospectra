services:
  searxng:
    image: searxng/searxng:latest
    ports: ["8888:8080"]
    volumes: ["./searxng:/etc/searxng"]
    restart: unless-stopped

  reacher:
    image: reacherhq/backend:latest
    ports: ["8080:8080"]
    environment:
      RCH_HELLO_NAME: qavren.dev
      RCH_FROM_EMAIL: hello@qavren.dev
    restart: unless-stopped